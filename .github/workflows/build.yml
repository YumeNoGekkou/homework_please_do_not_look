name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      - run: mvn clean test package
      - uses: actions/upload-artifact@v7
        with:
          name: jac
          path: target/site/jacoco/
